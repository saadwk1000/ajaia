services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ajaia
      POSTGRES_PASSWORD: ajaia
      POSTGRES_DB: ajaia
    volumes:
      - ajaia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajaia -d ajaia"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ajaia_postgres:
